<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB-115 Final Project</title>
    <link rel="stylesheet" href="project.css">
</head>
<body>
    <header>
        <img src="banner.png" alt="">
    </header>

    <main>
        <div id="emailInput">
            <form action="" onsubmit="return validateEmail();" name="emailInputForm">
                <label for="email">Please enter your email:</label>
                <input type="email" id="email" name="email"/>
                <input type="submit" name="" id="submitButton" value="Submit">
            </form>
        </div>
        
        <div id="customerInput" style="display: none;">
            <form onsubmit="return handleCustomerInput();">
                <label for="firstName">Please enter your First Name:</label>
                <input type="text" id="firstName" name="firstName">
    
                <label for="lastName">Please enter your Last Name:</label>
                <input type="text" id="lastName" name="lastName">
    
                <label for="weeklyGoal">Please enter your Weekly Goal: </label>
                <input type="text" id="weeklyGoal" name="weeklyGoal">
                <input type="submit" name="" id="submitButton" value="Submit">
            </form>
        </div>
    
        <div id="mealPlan" style="display: none;">
            <form >
                <table>
                    <tr>
                        <th>Day of Week</th>
                        <th>Breakfast</th>
                        <th>Snack 1</th>
                        <th>Lunch</th>
                        <th>Dinner</th>
                        <th>Snack 2</th>
                    </tr>
                    <tr>
                        <td>Monday</td>
                        <td><input type="text" name="monBreakfast"></td>
                        <td><input type="text" name="monSnack1"></td>
                        <td><input type="text" name="monLunch"></td>
                        <td><input type="text" name="monDinner"></td>
                        <td><input type="text" name="monSnack2"></td>
                    </tr>
                    <tr>
                        <td>Tuesday</td>
                        <td><input type="text" name="tueBreakfast"></td>
                        <td><input type="text" name="tueSnack1"></td>
                        <td><input type="text" name="tueLunch"></td>
                        <td><input type="text" name="tueDinner"></td>
                        <td><input type="text" name="tueSnack2"></td>
                    </tr>
                    <tr>
                        <td>Wednesday</td>
                        <td><input type="text" name="wedBreakfast"></td>
                        <td><input type="text" name="wedSnack1"></td>
                        <td><input type="text" name="wedLunch"></td>
                        <td><input type="text" name="wedDinner"></td>
                        <td><input type="text" name="wedSnack2"></td>
                    </tr>
                    <tr>
                        <td>Thursday</td>
                        <td><input type="text" name="thursBreakfast"></td>
                        <td><input type="text" name="thursSnack1"></td>
                        <td><input type="text" name="thursLunch"></td>
                        <td><input type="text" name="thursDinner"></td>
                        <td><input type="text" name="thursSnack2"></td>
                    </tr>
                    <tr>
                        <td>Friday</td>
                        <td><input type="text" name="friBreakfast"></td>
                        <td><input type="text" name="friSnack1"></td>
                        <td><input type="text" name="friLunch"></td>
                        <td><input type="text" name="friDinner"></td>
                        <td><input type="text" name="friSnack2"></td>
                    </tr>
                    <tr>
                        <td>Saturday</td>
                        <td><input type="text" name="satBreakfast"></td>
                        <td><input type="text" name="satSnack1"></td>
                        <td><input type="text" name="satLunch"></td>
                        <td><input type="text" name="satDinner"></td>
                        <td><input type="text" name="satSnack2"></td>
                    </tr>
                    <tr>
                        <td>Sunday</td>
                        <td><input type="text" name="sunBreakfast"></td>
                        <td><input type="text" name="sunSnack1"></td>
                        <td><input type="text" name="sunLunch"></td>
                        <td><input type="text" name="sunDinner"></td>
                        <td><input type="text" name="sunSnack2"></td>
                    </tr>
                </table>

                
                <button onclick="downloadTable()" id="genMealButton">Download Meal Plan</button>

                <button onclick="clear()" id="genMealButton">Clear</button>
                <button type="button" onclick="win()" id="genMealButton">Generate Meal Plan</button>

            </form>
            
    
            
        </div>
    </main>
    
    <script src="projectJS.js" defer></script>
</body>
</html>
